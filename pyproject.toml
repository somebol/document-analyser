[project]
name = "document-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.139.0",
    "gliner>=0.2.29",
    "ollama>=0.6.3",
    "protobuf>=7.36.2",
    "pydantic>=2.14.1",
    "qdrant-client>=1.19.1",
    "sentencepiece>=0.2.2",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "transformers>=5.16.1",
]

[project.scripts]
document-analyser = "document_analyser:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
