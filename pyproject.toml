[project]
name = "document-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "docling>=2.139.0",
    "fastapi>=0.156.2",
    "gliner>=0.2.29",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "protobuf>=7.36.2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
    "transformers>=5.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
document-analyser = "document_analyser:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
